name: Publish Pages Data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. These pairs map to 7 AM, 12 PM,
    # and 7 PM in America/Los_Angeles across daylight and standard time.
    - cron: "0 2,14,19 * * *" # PDT: UTC-7
    - cron: "0 3,15,20 * * *" # PST: UTC-8

jobs:
  publish-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check Pacific schedule window
        id: schedule-window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          if [ "${{ github.event.schedule }}" = "0 2,14,19 * * *" ] && [ "$pacific_offset" = "-0700" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.schedule }}" = "0 3,15,20 * * *" ] && [ "$pacific_offset" = "-0800" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping duplicate UTC schedule for current Pacific offset ($pacific_offset)."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout chrome-extension repository
        if: steps.schedule-window.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.schedule-window.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.schedule-window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        working-directory: backend

      - name: Checkout GitHub Pages repository
        if: steps.schedule-window.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          repository: RebelRemind/RebelRemind.github.io
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages-repo

      - name: Generate static JSON files
        if: steps.schedule-window.outputs.should_run == 'true'
        run: |
          python backend/export_pages_data.py --output-dir /tmp/rebel-pages-data/data --fallback-dir pages-repo/data

      - name: Copy generated data into Pages repository
        if: steps.schedule-window.outputs.should_run == 'true'
        run: |
          mkdir -p pages-repo/data
          rsync -av --delete /tmp/rebel-pages-data/data/ pages-repo/data/

      - name: Commit and push updated JSON
        if: steps.schedule-window.outputs.should_run == 'true'
        run: |
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to publish."
            exit 0
          fi
          git commit -m "Update RebelRemind data"
          git push
